# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
  branches:
    include:
    - main
    - development

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python38:
      python.version: '3.8'
    Python39:
      python.version: '3.9'
    Python310:
      python.version: '3.10'
    Python311:
      python.version: '3.11'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    pip install pytest pytest-azurepipelines
    pytest
  displayName: 'pytest'

- script: |
    pytest --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=80
  displayName: 'Run tests with coverage'

- task: PublishCodeCoverageResults@1
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
    reportDirectory: '$(System.DefaultWorkingDirectory)/htmlcov'
    failIfCoverageEmpty: true
  displayName: 'Publish code coverage results'

- script: |
    pylint src/ --exit-zero --output-format=json > pylint-report.json || true
    pylint src/ --exit-zero > pylint-report.txt || true
    echo "Pylint Analysis Complete"
    cat pylint-report.txt
  displayName: 'Run Pylint static analysis'

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'pylint-report.txt'
    artifactName: 'pylint-results'
    publishLocation: 'Container'
  displayName: 'Publish Pylint results'